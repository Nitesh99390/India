# ─────────────────────────────────────────────────────────────────────────────
#  Render Blueprint — NovelTranslator PRO v6.5 (master + embedded worker · MongoDB GridFS)
#  Dashboard → New → Blueprint → pick this repo → Apply. ONE thing to fill in:
#  BOT_TOKEN (from @BotFather) — Render prompts for it because `sync: false`.
#  API_ID · API_HASH · OWNER_ID · MONGO_URI have working built-in defaults in
#  config.py (set an env var only to override). The bot token is never committed.
#  The master service alone is a complete deployment (EMBEDDED_WORKER=1).
#  The second service is an OPTIONAL extra worker for parallel capacity —
#  delete it to stay within a single free instance.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: noveltranslator-master
    runtime: python
    plan: free
    region: singapore              # closest to India; change if you like
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python master.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      # ── REQUIRED: the bot token from @BotFather (/newbot). Entered once in the
      #    Render dashboard (Blueprint prompt or Environment tab); never stored in git. ──
      - key: BOT_TOKEN
        sync: false
      # ── API_ID / API_HASH / OWNER_ID: built into config.py. Uncomment to override. ──
      # - key: API_ID
      #   value: "36681596"
      # - key: API_HASH
      #   value: your_api_hash
      # - key: OWNER_ID              # your numeric Telegram ID (send /id to the bot)
      #   value: "6069200310"
      - key: ADMIN_USERS           # optional: comma-separated IDs that may approve users
        value: ""
      - key: AUTHORIZED_USERS      # optional: comma-separated IDs with lifetime access
        value: ""
      - key: PUBLIC_MODE           # "1" → everyone is approved automatically
        value: "0"
      - key: DEFAULT_APPROVAL      # duration for /approve without one: 1w · 1m · 1y · forever · 45d
        value: "1m"
      - key: EXPIRY_REMINDER_DAYS  # remind users N days before expiry (0 = off)
        value: "3"
      - key: REJECT_COOLDOWN_H     # hours before a rejected user may request again
        value: "24"
      # ── MongoDB: built-in Atlas free-tier cluster. Uncomment to use your own · "off" = RAM-only ──
      # - key: MONGO_URI
      #   value: mongodb+srv://user:pass@cluster.mongodb.net/?retryWrites=true&w=majority
      - key: MONGO_DB
        value: noveltranslator
      - key: SERVICE_ROLE
        value: master
      - key: EMBEDDED_WORKER      # "0" → polling-only master (needs a worker service)
        value: "1"
      - key: WORKER_STALE_AFTER   # seconds without heartbeat before a job is re-queued
        value: "150"
      - key: JOB_MAX_REQUEUES
        value: "2"
      - key: QUEUE_DONE_KEEP_H
        value: "24"
      - key: ORPHAN_FILE_AGE_H    # hours before an unreferenced GridFS upload is deleted
        value: "2"
      # Free-tier storage guard (Atlas M0 = 512 MB): prune old job history above 80 % of the budget
      - key: DB_BUDGET_MB
        value: "400"
      - key: DB_MAX_JOB_DOCS
        value: "3000"
      - key: DB_JOB_TTL_DAYS
        value: "60"
      # ── Mini App: RENDER_EXTERNAL_URL is injected by Render → /app works automatically ──
      # - key: PUBLIC_URL
      #   value: https://your-custom-domain.example
      # ── Optional backup forum group (bot must be admin). 0 = disabled ──
      - key: BACKUP_GROUP_ID
        value: "0"
      # ── Tuning ──
      - key: MAX_INPUT_MB
        value: "50"
      - key: MAX_JOBS_PER_USER
        value: "2"
      - key: CONCURRENCY
        value: "8"
      - key: KEEP_ALIVE            # self-ping so the free instance doesn't sleep
        value: "1"
      - key: KEEP_ALIVE_INTERVAL   # seconds (free tier sleeps after 15 min idle)
        value: "600"

  # ── OPTIONAL extra worker (parallel capacity). Safe to delete. ──
  - type: web
    name: noveltranslator-worker
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python worker.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      # REQUIRED: the SAME bot token as the master service (workers send the output
      # through the same bot). Entered in the Render dashboard, never in git.
      - key: BOT_TOKEN
        sync: false
      # API_ID / API_HASH + MongoDB are built into config.py. Uncomment to override:
      # - key: API_ID
      #   value: "36681596"
      # - key: API_HASH
      #   value: your_api_hash
      # - key: MONGO_URI
      #   value: mongodb+srv://user:pass@cluster.mongodb.net/?retryWrites=true&w=majority
      - key: MONGO_DB
        value: noveltranslator
      - key: SERVICE_ROLE
        value: worker
      - key: WORKER_NODE_ID
        generateValue: true
      - key: WORKER_HEARTBEAT_INTERVAL
        value: "30"
      - key: WORKER_POLL_INTERVAL
        value: "3"
