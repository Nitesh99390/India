# ─────────────────────────────────────────────────────────────────────────────
#  Render Blueprint — NovelTranslator PRO v6 (master + worker · MongoDB GridFS)
#  Dashboard → New → Blueprint → pick this repo → fill the secret env vars.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: noveltranslator-master
    runtime: python
    plan: free
    region: singapore              # closest to India; change if you like
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python master.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      # ── Telegram credentials (https://my.telegram.org & @BotFather) ──
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      # ── Access control (approval based — the owner / admins approve users) ──
      - key: OWNER_ID              # your numeric Telegram ID (send /id to the bot)
        sync: false
      - key: ADMIN_USERS           # optional: comma-separated IDs that may approve users
        value: ""
      - key: AUTHORIZED_USERS      # optional: comma-separated IDs with lifetime access
        value: ""
      - key: PUBLIC_MODE           # "1" → everyone is approved automatically
        value: "0"
      - key: DEFAULT_APPROVAL      # duration for /approve without one: 1w · 1m · 1y · forever · 45d
        value: "1m"
      - key: EXPIRY_REMINDER_DAYS  # remind users N days before expiry (0 = off)
        value: "3"
      - key: REJECT_COOLDOWN_H     # hours before a rejected user may request again
        value: "24"
      # ── MongoDB. Empty → built-in Atlas free-tier cluster · your own mongodb+srv://… · "off" = RAM-only ──
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: noveltranslator
      - key: SERVICE_ROLE
        value: master
      # Free-tier storage guard (Atlas M0 = 512 MB): prune old job history above 80 % of the budget
      - key: DB_BUDGET_MB
        value: "400"
      - key: DB_MAX_JOB_DOCS
        value: "3000"
      - key: DB_JOB_TTL_DAYS
        value: "60"
      # ── Mini App: RENDER_EXTERNAL_URL is injected by Render → /app works automatically ──
      # - key: PUBLIC_URL
      #   value: https://your-custom-domain.example
      # ── Optional backup forum group (bot must be admin). 0 = disabled ──
      - key: BACKUP_GROUP_ID
        value: "0"
      # ── Tuning ──
      - key: MAX_INPUT_MB
        value: "50"
      - key: MAX_JOBS_PER_USER
        value: "2"
      - key: CONCURRENCY
        value: "8"
      - key: KEEP_ALIVE            # self-ping so the free instance doesn't sleep
        value: "1"
      - key: KEEP_ALIVE_INTERVAL   # seconds (free tier sleeps after 15 min idle)
        value: "600"

  - type: web
    name: noveltranslator-worker
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python worker.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: noveltranslator
      - key: SERVICE_ROLE
        value: worker
      - key: WORKER_NODE_ID
        generateValue: true
      - key: WORKER_HEARTBEAT_INTERVAL
        value: "30"
      - key: WORKER_POLL_INTERVAL
        value: "3"
